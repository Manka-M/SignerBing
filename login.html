<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveBoy - Connexion</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/logo assets.png">
</head>
<body>
  <h1>
    <center class="title-connexion">
      LiveBoy ❤
    </center>
  </h1>
    <form src="http://liveboy.duckdns.org" method="post" class="box">
        <h1>Se Connecter</h1>
        <input type="text" name="Username" placeholder="Nom Utilisateur :">
        <input type="password" name="password" placeholder="Mot de passe :">
        <input type="submit" value="Connexion" onclick="Connexion()">
    </form>

<script>
  function Connexion() {
    onclick="Connexion()"
    alert("Vous êtes connecté !");
    // Redirection vers la page d'accueil
    window.location.href = "https://liveboy.duckdns.org";
  }
</script> 
  </body>
</html>
